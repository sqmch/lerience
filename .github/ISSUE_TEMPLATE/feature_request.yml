name: Feature request
description: Propose a learner or maintainer improvement
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the learner or maintainer problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier, safer, or more understandable?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Relevant constraints
      description: Consider local ownership, provider boundaries, course compatibility, and release safety.
  - type: checkboxes
    id: fit
    attributes:
      label: Product fit
      options:
        - label: This does not require the app to host learner data or provider credentials.
          required: true
