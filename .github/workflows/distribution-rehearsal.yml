name: Windows distribution rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-distribution-rehearsal
  cancel-in-progress: false

jobs:
  package:
    name: Non-promotable rehearsal / Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PRAXEUM_PRODUCT_NAME: Lerience Preview
      PRAXEUM_APP_ID: io.github.sqmch.lerience.preview
      PRAXEUM_EXECUTABLE_NAME: LeriencePreview
      PRAXEUM_RELEASE_REPOSITORY_URL: https://github.com/${{ github.repository }}/releases/
      PRAXEUM_RELEASE_PUBLIC_KEY_PATH: distribution/release-public-key.pem

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: pnpm check

      - name: Assemble reviewed Windows runtime
        run: pnpm runtime:assemble -- --output dist/runtime/win32-x64-rehearsal

      - name: Build rehearsal packages
        env:
          PRAXEUM_RUNTIME_ROOT: dist/runtime/win32-x64-rehearsal
        run: pnpm package:windows

      - name: Verify exact unpacked application
        run: |
          $verification = Start-Process -FilePath 'dist/package/windows-x64/win-unpacked/LeriencePreview.exe' -ArgumentList '--verify-installation' -WindowStyle Hidden -Wait -PassThru
          if ($verification.ExitCode -ne 0) { exit $verification.ExitCode }

      - name: Verify exact portable artifact
        run: |
          $version = (Get-Content -Raw 'package.json' | ConvertFrom-Json).version
          $portable = "dist/package/windows-x64/LeriencePreview-Portable-$version-x64.exe"
          $verification = Start-Process -FilePath $portable -ArgumentList '--verify-installation' -WindowStyle Hidden -Wait -PassThru
          if ($verification.ExitCode -ne 0) { exit $verification.ExitCode }

      - name: Record artifact hashes
        run: |
          Get-FileHash -Algorithm SHA256 'dist/package/windows-x64/*.exe' | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))"
          }

      - name: Upload short-lived rehearsal artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lerience-preview-windows-x64-${{ github.sha }}
          path: |
            dist/package/windows-x64/*.exe
            dist/runtime/win32-x64-rehearsal/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
