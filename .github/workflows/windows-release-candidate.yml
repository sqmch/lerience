name: Windows release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed tag, exactly vMAJOR.MINOR.PATCH
        required: true
        type: string
      create_draft:
        description: Create a draft in this public source repository after staging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-candidate-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed Windows x64 tag
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      source_commit: ${{ steps.release.outputs.source_commit }}
      version: ${{ steps.release.outputs.version }}
    env:
      PRAXEUM_PRODUCT_NAME: Lerience
      PRAXEUM_APP_ID: io.github.sqmch.lerience
      PRAXEUM_EXECUTABLE_NAME: Lerience
      PRAXEUM_RELEASE_REPOSITORY_URL: https://github.com/${{ github.repository }}/releases/
      PRAXEUM_RELEASE_PUBLIC_KEY_PATH: distribution/release-public-key.pem
      RELEASE_TAG: ${{ inputs.release_tag }}
      CREATE_DRAFT: ${{ inputs.create_draft }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}

    steps:
      - name: Check out reviewed release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity and provenance
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw 'package.json' | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag must be $expectedTag."
          }
          if ((git cat-file -t "refs/tags/$expectedTag") -ne 'tag') {
            throw 'The release tag must be annotated.'
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag is not on reviewed main history.' }
          if ($env:CREATE_DRAFT -eq 'true' -and $env:REPOSITORY_PRIVATE -eq 'true') {
            throw 'Release drafts may be created only in the canonical public source repository.'
          }
          $notes = "distribution/releases/$expectedTag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing reviewed release notes at $notes."
          }
          "source_commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact source
        run: pnpm check

      - name: Assemble reviewed Windows runtime
        run: pnpm runtime:assemble -- --output dist/runtime/win32-x64-release

      - name: Build release installer
        env:
          PRAXEUM_RUNTIME_ROOT: dist/runtime/win32-x64-release
        run: pnpm package:windows

      - name: Verify unpacked application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = "dist/package/windows-x64/win-unpacked/$env:PRAXEUM_EXECUTABLE_NAME.exe"
          $verification = Start-Process -FilePath $unpacked -ArgumentList '--verify-installation' -WindowStyle Hidden -Wait -PassThru
          if ($verification.ExitCode -ne 0) { exit $verification.ExitCode }

      - name: Collect checksum-pinned corresponding sources
        run: pnpm release:collect-sources -- --output dist/release-sources

      - name: Stage unsigned candidate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.release.outputs.version }}'
          New-Item -ItemType Directory -Path 'dist/release-inputs/release-sources' | Out-Null
          Copy-Item -LiteralPath "dist/package/windows-x64/$env:PRAXEUM_EXECUTABLE_NAME-Setup-$version-x64.exe" -Destination 'dist/release-inputs/'
          Copy-Item -Path 'dist/release-sources/*' -Destination 'dist/release-inputs/release-sources/'

      - name: Upload unsigned candidate inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-inputs-${{ steps.release.outputs.source_commit }}
          path: dist/release-inputs/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sign:
    name: Sign and stage exact release bundle
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release-signing
    env:
      PRODUCT_NAME: Lerience
      EXECUTABLE_NAME: Lerience
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Download exact candidate inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-inputs-${{ needs.build.outputs.source_commit }}
          path: dist/release-inputs

      - name: Materialize protected signing key
        id: signing
        shell: pwsh
        env:
          RELEASE_PRIVATE_KEY_PEM: ${{ secrets.RELEASE_PRIVATE_KEY_PEM }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PRIVATE_KEY_PEM)) {
            throw 'RELEASE_PRIVATE_KEY_PEM is not configured in release-signing.'
          }
          $privateKey = Join-Path $env:RUNNER_TEMP 'release-private.pem'
          [IO.File]::WriteAllText($privateKey, $env:RELEASE_PRIVATE_KEY_PEM, [Text.Encoding]::ASCII)
          "private_key=$privateKey" >> $env:GITHUB_OUTPUT
          "published_at=$([DateTimeOffset]::UtcNow.ToString('O'))" >> $env:GITHUB_OUTPUT

      - name: Sign exact manifest
        shell: pwsh
        run: |
          pnpm release:sign-manifest -- `
            --nsis "dist/release-inputs/$env:EXECUTABLE_NAME-Setup-${{ needs.build.outputs.version }}-x64.exe" `
            --notes "distribution/releases/$env:RELEASE_TAG.md" `
            --published-at '${{ steps.signing.outputs.published_at }}' `
            --private-key '${{ steps.signing.outputs.private_key }}' `
            --output dist/release-signed

      - name: Stage verified release bundle
        shell: pwsh
        run: |
          pnpm release:stage-windows -- `
            --nsis "dist/release-inputs/$env:EXECUTABLE_NAME-Setup-${{ needs.build.outputs.version }}-x64.exe" `
            --signed-dir dist/release-signed `
            --sources dist/release-inputs/release-sources `
            --notes "distribution/releases/$env:RELEASE_TAG.md" `
            --notices distribution/THIRD-PARTY-NOTICES.md `
            --public-key distribution/release-public-key.pem `
            --product-name $env:PRODUCT_NAME `
            --executable-name $env:EXECUTABLE_NAME `
            --source-commit '${{ needs.build.outputs.source_commit }}' `
            --output dist/release-bundle

      - name: Remove materialized signing key
        if: always()
        shell: pwsh
        run: |
          $privateKey = Join-Path $env:RUNNER_TEMP 'release-private.pem'
          if (Test-Path -LiteralPath $privateKey -PathType Leaf) {
            Remove-Item -LiteralPath $privateKey -Force
          }

      - name: Upload staged release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-bundle-${{ needs.build.outputs.source_commit }}
          path: dist/release-bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft:
    name: Create same-repository release draft
    if: inputs.create_draft
    needs: [build, sign]
    runs-on: windows-2025
    timeout-minutes: 10
    environment: release-publishing
    permissions:
      contents: write
    env:
      PRODUCT_NAME: Lerience
      EXECUTABLE_NAME: Lerience
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out exact release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Download staged release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-bundle-${{ needs.build.outputs.source_commit }}
          path: dist/release-bundle

      - name: Create draft release only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = gh repo view $env:GITHUB_REPOSITORY --json isPrivate | ConvertFrom-Json
          if ($metadata.isPrivate) { throw 'The canonical source repository must be public.' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'A release already exists for this tag.' }
          $version = '${{ needs.build.outputs.version }}'
          $expected = @(
            "$env:EXECUTABLE_NAME-$version-corresponding-source.tar.gz"
            "$env:EXECUTABLE_NAME-Setup-$version-x64.exe"
            'release-manifest.json'
            'release-manifest.sig'
            'SHA256SUMS'
          ) | Sort-Object
          $assets = Get-ChildItem -LiteralPath 'dist/release-bundle' -File
          $actual = $assets.Name | Sort-Object
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw 'The staged release bundle does not contain exactly the five approved uploads.'
          }
          $notes = "distribution/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing reviewed release notes at $notes."
          }
          $assetPaths = $assets | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @assetPaths `
            --repo $env:GITHUB_REPOSITORY `
            --title "$env:PRODUCT_NAME $env:RELEASE_TAG" `
            --notes-file $notes `
            --draft
