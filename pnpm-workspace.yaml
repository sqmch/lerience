allowBuilds:
  dugite: true
  electron: true
  # Squirrel.Windows is an unused optional peer; its architecture-selecting
  # install script must not run for the NSIS release path.
  electron-winstaller: false
  esbuild: true

# Match Dependabot's three-day quarantine so locally generated lockfiles pass
# the same supply-chain policy enforced by GitHub's updater.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: false

# Lerience uses the Agent SDK protocol library with the learner's installed
# Claude Code. Its optional native CLI packages must never be downloaded or
# packaged as an app-owned provider runtime (ADR-025).
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-*"

# Two transitive development-only packages under electron-builder carry high
# advisories (@xmldom/xmldom via plist, js-yaml via builder-util) and CI audits
# every dependency at that level. Pin the patched versions until electron-
# builder's own chain moves past them; nothing here reaches the packaged app.
overrides:
  "@xmldom/xmldom": "~0.8.15"
  js-yaml: "~4.3.2"
